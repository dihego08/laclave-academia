<script type="text/javascript">
    $(document).on('click', '.carousel-item img', function () {
        var src = $(this).attr('src');
        $('#imagenAmpliada').attr('src', src);
        $('#modalImagen').modal('show');
    });
    $(document).ready(function () {
        get_data();
        get_posts();
        localStorage.setItem('cur_url', window.location.href);
        //$(".click2edit").summernote();
        $('#nuevoPostModal').on('shown.bs.modal', function () {
            $('.click2edit').summernote();
        });

        let imagenesSeleccionadas = [];

        $('#imagen').on('change', function () {
            $('#previewContainer').empty();
            imagenesSeleccionadas = Array.from(this.files); // Guardamos los archivos seleccionados

            imagenesSeleccionadas.forEach((file, index) => {
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        const preview = $(`<div class="image-preview-wrapper" data-index="${index}">
                            <img src="${e.target.result}" alt="preview">
                            <button type="button" class="remove-btn" title="Eliminar imagen">&times;</button>
                        </div>`);
                        $('#previewContainer').append(preview);
                    };
                    reader.readAsDataURL(file);
                }
            });
        });

        // Evento para eliminar imagen individual
        $('#previewContainer').on('click', '.remove-btn', function () {
            const index = $(this).parent().data('index');
            imagenesSeleccionadas.splice(index, 1); // Quitamos la imagen de la lista

            // Volver a renderizar las miniaturas
            const dt = new DataTransfer();
            imagenesSeleccionadas.forEach(file => dt.items.add(file));
            $('#imagen')[0].files = dt.files;

            // Disparar el evento de cambio para volver a mostrar las nuevas miniaturas
            $('#imagen').trigger('change');
        });
    });
    function get_data() {
        $.post('logic/servicios.php?parAccion=get_data', function (data) {
            var obj = JSON.parse(data);

            if (obj.user_name == null || obj.user_name == "" || obj.user_name == undefined) {
                //location.href = "../";
                location.href = "../login/login_a.php";
            } else {
                $("#user_name").text(obj.user_name);
                $("#career_name").text(obj.carrera);
                $("#area_name").text(obj.area);
            }
        });
    }
    var dias = ['Domingo', 'Lunes', 'Martes', 'Miercoles', 'Jueves', 'Viernes', 'Sabado'];
    function get_posts() {
        $.post('logic/servicios.php?parAccion=get_posts', function (data) {
            var obj = JSON.parse(data);
            const baseImagePath = 'img/'; // Ajusta la ruta según tu servidor
            obj.Values.forEach(post => {
                const carouselId = `carouselPost${post.id}`;

                let carouselIndicators = '';
                let carouselItems = '';

                post.images.forEach((img, index) => {
                    const isActive = index === 0 ? 'active' : '';
                    const imageUrl = baseImagePath + img.imagen;

                    carouselIndicators += `
                    <li data-target="#${carouselId}" data-slide-to="${index}" class="${isActive}"></li>
                `;

                    carouselItems += `
                    <div class="carousel-item ${isActive}">
                        <img src="${imageUrl}" class="d-block w-100" alt="Imagen ${img.id}">
                    </div>
                `;
                });

                const carouselHTML = post.images.length > 0 ? `<div id="${carouselId}" class="carousel slide mt-3 mb-3" data-ride="carousel">
                    <ol class="carousel-indicators">
                        ${carouselIndicators}
                    </ol>
                    <div class="carousel-inner">
                        ${carouselItems}
                    </div>
                    <a class="carousel-control-prev" href="#${carouselId}" role="button" data-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="sr-only">Anterior</span>
                    </a>
                    <a class="carousel-control-next" href="#${carouselId}" role="button" data-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="sr-only">Siguiente</span>
                    </a>
                </div>` : '';

                const card = $(`<div class="card post-card shadow-sm">
                    <div class="card-body">
                        <div class="post-author">${post.nombres} ${post.apellidos}</div>
                        <div class="text-muted small mb-2">${post.fecha_creacion}</div>
                        <div class="post-content">${post.post}</div>
                        ${carouselHTML}
                    </div>
                    <div class="card-footer">
                        <h6>Comentarios</h6>
                        <hr class="d-block w-100">
                        <div class="row w-100">
                            <div class="col-md-12">
                                <input type="text" class="form-control w-100 comment-input_${post.id}" placeholder="Escribe un comentario...">
                            </div>
                            <div class="col-md-12 text-right mt-1">
                                <span class="btn btn-primary btn-sm" onclick="guardarComentario(${post.id});"><i class="nc-icon nc-send" style="font-weight: bold;"></i> Enviar</span>
                            </div>
                        </div>
                        <div class="comments-container w-100" data-post-id="${post.id}">
                            <!-- Aquí se cargarán los comentarios con AJAX -->
                        </div>
                    </div>
                </div>`);

                $('#postList').append(card);
                //cargarComentarios(post.id);
            });
            $('.comments-container').each(function () {
                var postId = $(this).data('post-id');
                cargarComentarios(postId);
            });
        });
    }
    function cargarComentarios(postId) {
        $.ajax({
            url: 'logic/servicios.php?parAccion=cargarComentarios',
            method: 'POST',
            data: { id_post: postId },
            success: function (response) {
                var res = JSON.parse(response);
                if (res.Result === 'OK') {
                    var html = '';
                    res.Values.forEach(function (c) {
                        html += `<div class="mb-2 d-block"><strong style="line-height: 1.5 !important;">${c.nombres} ${c.apellidos}</strong>
                            <div class="text-muted small d-block" style="line-height: 1 !important;">${c.fecha_creacion}</div>
                            <p class="mb-0 mt-2">${c.texto}</p>
                        </div><hr>`;
                    });
                    $('.comments-container[data-post-id="' + postId + '"]').html(html);
                }
            }
        });
    }
    function guardarComentario(id) {
        $.post('logic/servicios.php?parAccion=guardarComentario', {
            id_post: id,
            comentario: $(".comment-input_" + id).val()
        }, function (data) {
            var obj = JSON.parse(data);
            $(".comment-input_" + id).val('');
            cargarComentarios(id);
        });
    }
    function limpiar_formulario() {
        $('.click2edit').summernote('code', '');
        $("#imagen").val('');
        $("#previewContainer").empty();
    }
</script>
<script>
    function _(el) {
        return document.getElementById(el);
    }

    function uploadFile() {
        var files = _("imagen").files;
        var formdata = new FormData();
        formdata.append("post", $('.click2edit').summernote('code'));
        for (let i = 0; i < files.length; i++) {
            formdata.append("imagenes[]", files[i]); // usamos un array con [] para múltiples archivos
        }

        var ajax = new XMLHttpRequest();
        ajax.upload.addEventListener("progress", progressHandler, false);
        ajax.addEventListener("load", completeHandler, false);
        ajax.addEventListener("error", errorHandler, false);
        ajax.addEventListener("abort", abortHandler, false);
        ajax.open("POST", "logic/servicios.php?parAccion=guardar_post");
        ajax.send(formdata);
    }

    function progressHandler(event) {
        _("loaded_n_total").innerHTML = "Uploaded " + event.loaded + " bytes of " + event.total;
        var percent = (event.loaded / event.total) * 100;
        _("progressBar").value = Math.round(percent);
    }

    function completeHandler(event) {
        var res = JSON.parse(event.target.response);
        if (res.Result == "OK") {
            bootbox.alert({
                message: '<div class="alert alert-success" style="margin-top: 5%; margin-bottom: 0;">' +
                    '<strong>Publicación Creada Correctamente.</strong>' +
                    '</div>'
            });
            //$("#nuevoPostModal").hide();
            limpiar_formulario();
            get_posts();
        } else {
            bootbox.alert({
                message: '<div class="alert alert-danger" style="margin-top: 5%; margin-bottom: 0;">' +
                    '<strong>Algo ha salido mal.</strong>' +
                    '</div>'
            });
        }
        _("progressBar").value = 0;
    }

    function errorHandler(event) {
        _("status").innerHTML = "Upload Failed";
    }

    function abortHandler(event) {
        _("status").innerHTML = "Upload Aborted";
    }
</script>
